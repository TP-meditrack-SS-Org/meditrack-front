name: CI Angular

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

jobs:
  ci-angular:
    name: Angular CI (Node ${{ matrix.node-version }})
    strategy:
      fail-fast: false
      matrix:
        node-version: ["18", "20"]
    uses: TP-meditrack-SS-Org/shared-workflow-ci/.github/workflows/ci-express.yml@main
    secrets: inherit
    with:
      node-version: ${{ matrix.node-version }}
      test-command: npm run test:ci

  check-staging-secret:
    name: Check staging secret exposure
    needs: ci-angular
    runs-on: ubuntu-latest
    environment: staging

    steps:
      - name: Check staging secrets availability
        run: |
          if [ -z "${{ secrets.STAGING_API_KEY }}" ]; then
            echo "STAGING_API_KEY is not exposed in staging."
            exit 1
          fi
          if [ -z "${{ secrets.STAGING_DATABASE_URL }}" ]; then
            echo "STAGING_DATABASE_URL is not exposed in staging."
            exit 1
          fi
          echo "STAGING_API_KEY and STAGING_DATABASE_URL are exposed in staging."
